{% if messages %}
  <div class="rc-toast-container" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
      <div class="rc-toast rc-toast-{{ message.tags|default:'info' }} shadow-lg" role="alert">
        <div class="fs-5 flex-shrink-0">
          {% if message.tags == 'success' %}
            <i class="bi bi-check-circle-fill text-success"></i>
          {% elif message.tags == 'error' or message.tags == 'danger' %}
            <i class="bi bi-exclamation-triangle-fill text-danger"></i>
          {% elif message.tags == 'warning' %}
            <i class="bi bi-exclamation-circle-fill text-warning"></i>
          {% else %}
            <i class="bi bi-info-circle-fill text-info"></i>
          {% endif %}
        </div>
        <div class="flex-grow-1 small fw-medium text-dark">
          {{ message }}
        </div>
        <button type="button" class="btn-close btn-close-sm flex-shrink-0" onclick="this.closest('.rc-toast').remove()" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
