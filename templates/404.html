{% extends 'base.html' %}

{% block title %}404 - Page Not Found | RailConnect{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="display-1 fw-bold text-danger mb-3">404</div>
      <h2 class="h3 fw-bold text-dark mb-3">Track Not Found!</h2>
      <p class="text-muted mb-4 lead">
        The destination station or page you were trying to reach does not exist or has been rerouted.
      </p>
      <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'core:home' %}" class="btn btn-rc-primary px-4">
          🚂 Back to Main Station (Home)
        </a>
        <a href="/bookings/pnr-lookup/" class="btn btn-outline-secondary px-4">
          Check PNR Status
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
